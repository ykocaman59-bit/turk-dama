<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
<title>Türk Daması Pro</title>
<style>
:root {
    --board-bg: #b07c53;
    --board-light: #e8c39e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background: #110a05;
    color: #fff;
    user-select: none;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* --- TEPEDEKİ TAŞ HAVUZLARI (SAĞDAN SOLA EKSİLME) --- */
#top-container {
    width: 100%;
    max-width: 450px;
    padding: 10px 10px 5px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.stone-pool {
    display: flex;
    justify-content: flex-end; /* Taşların sağa yaslanmasını ve sağdan sola eksilmesini sağlar */
    width: 100%;
    height: 22px;
    gap: 2px;
}
.pool-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.8), 0 1px 2px rgba(255,255,255,0.2);
}
.pool-dot.white-p { background: radial-gradient(circle, #fff 20%, #ccc 90%); border: 1px solid #aaa; }
.pool-dot.black-p { background: radial-gradient(circle, #444 20%, #111 90%); border: 1px solid #000; }

#status-bar {
    font-size: 14px;
    background: rgba(61, 37, 18, 0.8);
    color: #e6c280;
    padding: 4px 14px;
    border-radius: 12px;
    border: 1px solid #5a330b;
    margin: 4px auto;
    font-weight: bold;
    text-align: center;
}

/* --- TAHTA VE ÇERÇEVE --- */
#board-container {
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 5px;
}
#board-wrapper {
    padding: 8px;
    background: #4a2c11; 
    border-radius: 4px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.9);
    border: 6px solid #2c1d11; /* Ayarlar menüsünden açılıp kapanan çerçeve */
    transition: border 0.2s ease;
}
#board {
    display: grid;
    grid-template-columns: repeat(8, min(11.5vw, 6vh));
    grid-template-rows: repeat(8, min(11.5vw, 6vh));
    border: 2px solid #1a0f0a;
}
.cell {
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    position: relative;
}
.light { background: var(--board-light); }
.dark { background: var(--board-bg); }

/* --- ENJEKTE EDİLEN AYAR DESTEKLERİ --- */
.selected {
    outline: 3px solid #ffeb3b;
    outline-offset: -3px;
    z-index: 5;
}
.last-move-cell {
    box-shadow: inset 0 0 12px 5px rgba(241, 196, 15, 0.8);
}
.hint-move {
    position: absolute;
    width: 35%; height: 35%;
    background: rgba(46, 204, 113, 0.85);
    border-radius: 50%;
    pointer-events: none;
}
.hint-capture {
    position: absolute;
    width: 100%; height: 100%;
    background: rgba(231, 76, 60, 0.35);
    border: 3px solid #e74c3c;
    pointer-events: none;
}

/* TAŞLAR VE ŞAH (DAMA) SİSTEMİ */
.piece {
    width: 86%; height: 86%;
    border-radius: 50%;
    position: relative;
    box-shadow: 0 5px 6px rgba(0,0,0,0.6);
}
.piece.w-stone { background: radial-gradient(circle, #ffffff 10%, #cccccc 90%); border: 2px solid #b5b5b5; }
.piece.b-stone { background: radial-gradient(circle, #555555 10%, #151515 90%); border: 2px solid #000000; }
.piece.king-mode::after {
    content: "👑";
    position: absolute;
    font-size: min(5.5vw, 3.2vh);
    top: 50%; left: 50%;
    transform: translate(-50%, -55%);
    text-shadow: 0 2px 3px rgba(0,0,0,0.8);
}

/* --- ORİJİNAL SABİT ALT BAR BUTONLARI --- */
#bottom-bar {
    width: 100%;
    background: #2c1a0c;
    border-top: 3px solid #1a0f07;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
}
.menu-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: none;
    border: none;
    color: #e6c280;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    width: 30%;
    transition: transform 0.1s ease;
}
.menu-btn:active { transform: scale(0.92); }
.menu-btn-icon {
    font-size: 22px;
    margin-bottom: 4px;
}

/* --- PARŞÖMEN PENCERELER (MODALS) --- */
.modal-layer {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 90;
}
.scroll-parchment {
    background: #e6c280;
    background-image: radial-gradient(circle, #f3dbab 0%, #d4a359 100%);
    color: #311c07;
    padding: 24px;
    border-radius: 14px;
    border: 4px solid #5a330b;
    box-shadow: 0 0 25px rgba(0,0,0,0.9);
    width: 320px;
    text-align: center;
    font-weight: bold;
}
.scroll-parchment h2 {
    font-size: 26px;
    margin-bottom: 15px;
    border-bottom: 2px solid #5a330b;
    padding-bottom: 6px;
}
.setup-row {
    display: flex;
    align-items: center;
    margin: 14px 0;
    font-size: 16px;
}
.setup-row input[type="checkbox"] {
    width: 22px; height: 22px;
    margin-right: 12px;
    accent-color: #5a330b;
}

/* Taş Seçim Alanı */
.stone-pick-flex {
    display: flex;
    justify-content: space-around;
    margin: 18px 0;
}
.stone-pick-box {
    width: 85px; height: 85px;
    border: 3px solid #5a330b;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    background: rgba(255,255,255,0.2);
}
.stone-pick-box.selected-pick {
    outline: 4px solid #2ecc71;
    background: rgba(46, 204, 113, 0.3);
}
.stone-pick-box .inner-stone {
    width: 55px; height: 55px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}
.stone-pick-box .inner-stone.w { background: radial-gradient(circle, #fff 0%, #ddd 100%); border: 1px solid #bbb; }
.stone-pick-box .inner-stone.b { background: radial-gradient(circle, #444 0%, #111 100%); border: 1px solid #000; }

/* Üst Tema Değiştirici */
.theme-nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    background: rgba(0,0,0,0.08);
    padding: 8px;
    border-radius: 8px;
}
.arrow-click { font-size: 24px; cursor: pointer; color: #5a330b; }
.mini-preview-grid {
    width: 44px; height: 44px;
    border: 2px solid #5a330b;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
}

/* Slider */
.range-wrap { margin: 16px 0; text-align: left; }
input[type="range"] { width: 100%; accent-color: #5a330b; cursor: pointer; }
.range-labels { display: flex; justify-content: space-between; font-size: 13px; color: #4a2c11; margin-top: 4px; }

.action-submit {
    background: #5a330b;
    color: #fff;
    border: none;
    padding: 12px;
    font-size: 17px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
    margin-top: 10px;
    box-shadow: 0 5px 6px rgba(0,0,0,0.4);
}
</style>
</head>
<body>

<div id="top-container">
    <div class="stone-pool" id="pool-blacks"></div>
    <div class="stone-pool" id="pool-whites"></div>
    <div id="status-bar">Sıra: Beyaz (Sizde)</div>
</div>

<div id="board-container">
    <div id="board-wrapper">
        <div id="board"></div>
    </div>
</div>

<div id="bottom-bar">
    <button class="menu-btn" onclick="openModal('newgame-pop')">
        <span class="menu-btn-icon">⚪</span><span>Yeni</span>
    </button>
    <button class="menu-btn" onclick="openModal('settings-pop')">
        <span class="menu-btn-icon">⚙️</span><span>Ayarlar</span>
    </button>
    <button class="menu-btn" onclick="openModal('mainmenu-pop')">
        <span class="menu-btn-icon">☰</span><span>Menü</span>
    </button>
</div>

<div id="newgame-pop" class="modal-layer" style="display: none;">
    <div class="scroll-parchment">
        <h2>Yeni oyun</h2>
        <div class="setup-row">
            <input type="checkbox" id="bot-active" checked>
            <label for="bot-active">Tek oyuncu</label>
        </div>
        <p style="margin-top: 12px;">Taş seç</p>
        <div class="stone-pick-flex">
            <div class="stone-pick-box selected-pick" id="pick-w" onclick="selectSide('white')">
                <div class="inner-stone w">👑</div>
            </div>
            <div class="stone-pick-box" id="pick-b" onclick="selectSide('black')">
                <div class="inner-stone b">👑</div>
            </div>
        </div>
        <button class="action-submit" onclick="startNewGame()">Başla</button>
    </div>
</div>

<div id="settings-pop" class="modal-layer" style="display: none;">
    <div class="scroll-parchment">
        <h2>Ayarlar</h2>
        <div class="theme-nav-row">
            <span class="arrow-click" onclick="toggleTheme(-1)">◀</span>
            <div class="mini-preview-grid" id="mini-box">
                <div style="background:#e8c39e;"></div><div style="background:#b07c53;"></div>
                <div style="background:#b07c53;"></div><div style="background:#e8c39e;"></div>
            </div>
            <span class="arrow-click" onclick="toggleTheme(1)">▶</span>
        </div>
        <div class="range-wrap">
            <label>Zorluk</label>
            <input type="range" id="bot-tier" min="1" max="3" value="2">
            <div class="range-labels"><span>kolay</span><span>seviye 3</span><span>zor</span></div>
        </div>
        <div class="setup-row"><input type="checkbox" id="opt-lastmove" checked onchange="renderBoard()"><label>Son hamleyi göster</label></div>
        <div class="setup-row"><input type="checkbox" id="opt-undo" checked><label>Geri almayı etkinleştir</label></div>
        <div class="setup-row"><input type="checkbox" id="opt-hints" checked><label>Kareleri işaretle</label></div>
        <div class="setup-row"><input type="checkbox" id="opt-frame" checked onchange="applyFrameSettings()"><label>Tahta çerçevesini göster</label></div>
        <div class="setup-row"><input type="checkbox" id="opt-audio" checked><label>Sesleri çal</label></div>
        <button class="action-submit" onclick="closeModal('settings-pop')">Tamam</button>
    </div>
</div>

<div id="mainmenu-pop" class="modal-layer" style="display: none;">
    <div class="scroll-parchment">
        <h2>Ana Menü</h2>
        <p style="font-size:14px; margin: 12px 0;">Türk Daması Pro Sürüm v1.2</p>
        <button class="action-submit" onclick="closeModal('mainmenu-pop')">Oyuna Dön</button>
        <button class="action-submit" style="background:#a04000;" id="undo-btn-menu" onclick="triggerUndoAction()">Hamle Geri Al</button>
        <button class="action-submit" style="background:#8c2d19;" onclick="location.reload()">Oyunu Sıfırla</button>
    </div>
</div>

<div id="gameover-pop" class="modal-layer" style="display: none;">
    <div class="scroll-parchment">
        <h2 id="over-title">Oyun Bitti</h2>
        <p id="over-desc" style="margin: 15px 0;"></p>
        <button class="action-submit" onclick="closeModal('gameover-pop'); openModal('newgame-pop');">Yeniden Başla</button>
    </div>
</div>

<script>
// --- SES SİSTEMİ (ENJEKTE EDİLDİ) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playAudio(type) {
    if (!document.getElementById("opt-audio").checked) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === "move") {
        osc.frequency.setValueAtTime(250, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    } else if (type === "eat") {
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.12);
    } else if (type === "king") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(350, audioCtx.currentTime);
        osc.frequency.setValueAtTime(550, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }
}

// --- TEMA SİSTEMİ ---
let currentThemeIdx = 0;
const themes = [
    { bg: '#b07c53', light: '#e8c39e' },
    { bg: '#2b5797', light: '#719bd6' },
    { bg: '#272727', light: '#999999' }
];
function toggleTheme(direction) {
    currentThemeIdx = (currentThemeIdx + direction + themes.length) % themes.length;
    let t = themes[currentThemeIdx];
    document.documentElement.style.setProperty('--board-bg', t.bg);
    document.documentElement.style.setProperty('--board-light', t.light);
    let cells = document.getElementById("mini-box").children;
    cells[0].style.background = t.light; cells[1].style.background = t.bg;
    cells[2].style.background = t.bg; cells[3].style.background = t.light;
}

// --- OYUN MATRİS VE HAFIZA YÖNETİMİ ---
let grid = [];
let activeTurn = "white";
let playerColor = "white";
let isSinglePlayer = true;
let selectedPos = null;
let comboPiecePos = null;
let lastExecutedMove = null;
let historySnapshot = null; // Geri alma özelliği için durum yedeği

function openModal(id) { document.getElementById(id).style.display = "flex"; }
function closeModal(id) { document.getElementById(id).style.display = "none"; }

function selectSide(color) {
    playerColor = color;
    document.getElementById("pick-w").classList.remove("selected-pick");
    document.getElementById("pick-b").classList.remove("selected-pick");
    document.getElementById(color === "white" ? "pick-w" : "pick-b").classList.add("selected-pick");
}

function applyFrameSettings() {
    let show = document.getElementById("opt-frame").checked;
    document.getElementById("board-wrapper").style.border = show ? "6px solid #2c1d11" : "none";
}

// OYUNU BAŞLATMA
window.addEventListener("DOMContentLoaded", () => {
    openModal('newgame-pop');
});

function startNewGame() {
    isSinglePlayer = document.getElementById("bot-active").checked;
    closeModal('newgame-pop');
    
    // Klasik Türk Daması Başlangıç Dizilimi (2. ve 3. sıralar Siyah, 6. ve 7. sıralar Beyaz)
    grid = [
        ["","","","","","","",""],
        ["b","b","b","b","b","b","b","b"],
        ["b","b","b","b","b","b","b","b"],
        ["","","","","","","",""],
        ["","","","","","","",""],
        ["w","w","w","w","w","w","w","w"],
        ["w","w","w","w","w","w","w","w"],
        ["","","","","","","",""]
    ];
    activeTurn = "white";
    selectedPos = null;
    comboPiecePos = null;
    lastExecutedMove = null;
    historySnapshot = null;

    applyFrameSettings();
    updateTopPools();
    renderBoard();
    triggerBotCheck();
}

// HAVUZA TAŞ ÇİZİMİ (Sağdan Sola Doğru Eksilme Kurallı)
function updateTopPools() {
    let currentWhiteCount = 0, currentBlackCount = 0;
    for(let r=0; r<8; r++) {
        for(let c=0; c<8; c++) {
            if("wW".includes(grid[r][c])) currentWhiteCount++;
            if("bB".includes(grid[r][c])) currentBlackCount++;
        }
    }
    
    let pWhites = document.getElementById("pool-whites");
    let pBlacks = document.getElementById("pool-blacks");
    pWhites.innerHTML = ""; pBlacks.innerHTML = "";

    // Canlı kalan taş kadar yuvarlak eklenir, flex-end olduğu için yenilen taşlar otomatik olarak sağdan sola eksilir
    for(let i=0; i<currentWhiteCount; i++) {
        let d = document.createElement("div"); d.className = "pool-dot white-p";
        pWhites.appendChild(d);
    }
    for(let i=0; i<currentBlackCount; i++) {
        let d = document.createElement("div"); d.className = "pool-dot black-p";
        pBlacks.appendChild(d);
    }
}

// GERİ ALMA İŞLEVİ (ENJEKTE EDİLDİ)
function saveState() {
    historySnapshot = {
        grid: JSON.parse(JSON.stringify(grid)),
        activeTurn: activeTurn,
        lastExecutedMove: lastExecutedMove ? JSON.parse(JSON.stringify(lastExecutedMove)) : null
    };
}

function triggerUndoAction() {
    if (!document.getElementById("opt-undo").checked || !historySnapshot) {
        alert("Geri alınacak hamle yok veya ayar kapalı!");
        return;
    }
    grid = historySnapshot.grid;
    activeTurn = historySnapshot.activeTurn;
    lastExecutedMove = historySnapshot.lastExecutedMove;
    historySnapshot = null;
    selectedPos = null;
    comboPiecePos = null;
    closeModal('mainmenu-pop');
    updateTopPools();
    renderBoard();
}

// --- TÜRK DAMASI KURAL VE MOTORU ---
function isInBounds(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }

function teamHasCaptureOption(side) {
    let matchTokens = side === "white" ? "wW" : "bB";
    for(let r=0; r<8; r++) {
        for(let c=0; c<8; c++) {
            if(matchTokens.includes(grid[r][c])) {
                if(calculateRawMoves(r, c).some(m => m.type === "capture")) return true;
            }
        }
    }
    return false;
}

function calculateRawMoves(r, c) {
    let p = grid[r][c];
    if(!p) return [];
    let isKing = (p === "W" || p === "B");
    let isWhite = (p === "w" || p === "W");
    let moveList = [];
    let directions = [[1,0], [-1,0], [0,1], [0,-1]]; // İleri, Geri, Sağ, Sol

    if(!isKing) {
        // Normal Taş Kuralları: Türk damasında normal taş GERİYE gidemez
        let illegalDir = isWhite ? [1,0] : [-1,0]; 
        for(let [dr, dc] of directions) {
            if(dr === illegalDir[0] && dc === illegalDir[1]) continue;
            
            let nr = r + dr, nc = c + dc;
            if(isInBounds(nr, nc) && grid[nr][nc] === "") {
                moveList.push({ r: nr, c: nc, type: "move" });
            }
            
            let lr = r + dr*2, lc = c + dc*2;
            if(isInBounds(lr, lc)) {
                let victimPiece = grid[nr][nc];
                if(victimPiece !== "" && isWhite !== "wW".includes(victimPiece) && grid[lr][lc] === "") {
                    moveList.push({ r: lr, c: lc, type: "capture", victim: { r: nr, c: nc } });
                }
            }
        }
    } else {
        // Dama (Şah) Taşı Kuralları: Yatay ve dikeyde sınırsız kare gidebilir ve uzaktan taş yiyebilir
        for(let [dr, dc] of directions) {
            let nr = r + dr, nc = c + dc;
            let foundVictim = null;
            while(isInBounds(nr, nc)) {
                let currentCell = grid[nr][nc];
                if(!foundVictim) {
                    if(currentCell === "") {
                        moveList.push({ r: nr, c: nc, type: "move" });
                    } else if(isWhite !== "wW".includes(currentCell)) {
                        foundVictim = { r: nr, c: nc };
                    } else { break; }
                } else {
                    if(currentCell === "") {
                        moveList.push({ r: nr, c: nc, type: "capture", victim: { r: foundVictim.r, c: foundVictim.c } });
                    } else { break; }
                }
                nr += dr; nc += dc;
            }
        }
    }
    return moveList;
}

function getLegalMoves(r, c) {
    if(comboPiecePos && (comboPiecePos.r !== r || comboPiecePos.c !== c)) return [];
    let list = calculateRawMoves(r, c);
    let side = "wW".includes(grid[r][c]) ? "white" : "black";
    
    // Türk damasında taş yemek mecburidir
    if(teamHasCaptureOption(side)) {
        list = list.filter(m => m.type === "capture");
    }
    return list;
}

// TAHTAYI EKRANA ÇİZME
function renderBoard() {
    let bEl = document.getElementById("board");
    bEl.innerHTML = "";
    let showHints = document.getElementById("opt-hints").checked;
    let showLastMove = document.getElementById("opt-lastmove").checked;

    for(let r=0; r<8; r++) {
        for(let c=0; c<8; c++) {
            let square = document.createElement("div");
            square.className = "cell " + ((r + c) % 2 ? "dark" : "light");

            if(selectedPos && selectedPos.r === r && selectedPos.c === c) square.classList.add("selected");
            
            if(showLastMove && lastExecutedMove && ((lastExecutedMove.from.r === r && lastExecutedMove.from.c === c) || (lastExecutedMove.to.r === r && lastExecutedMove.to.c === c))) {
                square.classList.add("last-move-cell");
            }

            let token = grid[r][c];
            if(token) {
                let pDiv = document.createElement("div");
                pDiv.className = `piece ${"wW".includes(token) ? 'w-stone' : 'b-stone'} ${"WB".includes(token) ? 'king-mode' : ''}`;
                square.appendChild(pDiv);
            }

            if(selectedPos && showHints) {
                let validMoves = getLegalMoves(selectedPos.r, selectedPos.c);
                let hit = validMoves.find(m => m.r === r && m.c === c);
                if(hit) {
                    let indicator = document.createElement("div");
                    indicator.className = hit.type === "capture" ? "hint-capture" : "hint-move";
                    square.appendChild(indicator);
                }
            }

            square.onclick = () => handleSquareClick(r, c);
            bEl.appendChild(square);
        }
    }

    let sideText = activeTurn === "white" ? "Beyaz" : "Siyah";
    let modeText = (isSinglePlayer && activeTurn !== playerColor) ? "(Bot Oynuyor...)" : "(Sizde)";
    document.getElementById("status-bar").textContent = `Sıra: ${sideText} ${modeText}`;
}

function handleSquareClick(r, c) {
    if(isSinglePlayer && activeTurn !== playerColor) return; // Sıra bottayken tıklamaları kilitle
    
    let clickedToken = grid[r][c];
    if(clickedToken && ((activeTurn === "white") === "wW".includes(clickedToken))) {
        if(comboPiecePos && (comboPiecePos.r !== r || comboPiecePos.c !== c)) return;
        selectedPos = { r, c };
        renderBoard();
        return;
    }
    if(!selectedPos) return;
    executeAction(r, c);
}

function executeAction(r, c) {
    let legals = getLegalMoves(selectedPos.r, selectedPos.c);
    let matched = legals.find(m => m.r === r && m.c === c);
    if(!matched) return;

    saveState(); // Hamle yapılmadan önce yedek al (Geri alma ayarı için)

    let movingPiece = grid[selectedPos.r][selectedPos.c];
    if(matched.type === "capture") {
        grid[matched.victim.r][matched.victim.c] = "";
        playAudio("eat");
    } else {
        playAudio("move");
    }

    grid[r][c] = movingPiece;
    grid[selectedPos.r][selectedPos.c] = "";
    lastExecutedMove = { from: { r: selectedPos.r, c: selectedPos.c }, to: { r, c } };

    // Dama Sırasına Ulaşma Kontrolü
    let becameKing = false;
    if(movingPiece === "w" && r === 0) { grid[r][c] = "W"; becameKing = true; }
    if(movingPiece === "b" && r === 7) { grid[r][c] = "B"; becameKing = true; }
    if(becameKing) playAudio("king");

    updateTopPools();

    // Çoklu Taş Yeme Kombinasyonu (Combo) Kontrolü
    if(matched.type === "capture") {
        let multiKills = calculateRawMoves(r, c).filter(m => m.type === "capture");
        if(multiKills.length > 0) {
            comboPiecePos = { r, c };
            selectedPos = { r, c };
            renderBoard();
            if(isSinglePlayer && activeTurn !== playerColor) {
                setTimeout(triggerBotIntelligence, 600);
            }
            return;
        }
    }

    comboPiecePos = null;
    selectedPos = null;
    activeTurn = (activeTurn === "white") ? "black" : "white";
    renderBoard();

    if(checkGameOver()) return;
    triggerBotCheck();
}

function triggerBotCheck() {
    if(isSinglePlayer && activeTurn !== playerColor) {
        setTimeout(triggerBotIntelligence, 600);
    }
}

// --- SİSTEMİN KENDİ KENDİNE OYNAMASINI SAĞLAYAN YAPAY ZEKA ---
function triggerBotIntelligence() {
    let availableUnits = [];
    let alliance = activeTurn === "white" ? "wW" : "bB";
    
    for(let r=0; r<8; r++) {
        for(let c=0; c<8; c++) {
            if(alliance.includes(grid[r][c])) {
                let options = getLegalMoves(r, c);
                if(options.length > 0) availableUnits.push({ r, c, options });
            }
        }
    }
    if(availableUnits.length === 0) return;

    let difficultyTier = parseInt(document.getElementById("bot-tier").value);
    let hasCaptureMove = availableUnits.some(u => u.options.some(o => o.type === "capture"));

    // Eğer zor moddaysa veya yenecek taş varsa en iyi hamleyi seçer, kolay moddaysa rastgele oynar
    if(hasCaptureMove || difficultyTier === 3) {
        let flattenedMoves = [];
        availableUnits.forEach(u => {
            u.options.forEach(o => {
                flattenedMoves.push({
                    from: { r: u.r, c: u.c },
                    to: o,
                    weight: (o.type === "capture" ? 20 : 1)
                });
            });
        });
        flattenedMoves.sort((a, b) => b.weight - a.weight);
        let optimal = flattenedMoves[0];
        selectedPos = optimal.from;
        executeAction(optimal.to.r, optimal.to.c);
    } else {
        let chosenUnit = availableUnits[Math.floor(Math.random() * availableUnits.length)];
        let chosenMove = chosenUnit.options[Math.floor(Math.random() * chosenUnit.options.length)];
        selectedPos = { r: chosenUnit.r, c: chosenUnit.c };
        executeAction(chosenMove.r, chosenMove.c);
    }
}

// OYUN BİTTİ KONTROLÜ
function checkGameOver() {
    let wCount = 0, bCount = 0, wHasMoves = false, bHasMoves = false;
    for(let r=0; r<8; r++) {
        for(let c=0; c<8; c++) {
            if("wW".includes(grid[r][c])) { wCount++; if(getLegalMoves(r,c).length > 0) wHasMoves = true; }
            if("bB".includes(grid[r][c])) { bCount++; if(getLegalMoves(r,c).length > 0) bHasMoves = true; }
        }
    }
    
    let winner = null;
    if(bCount === 0 || !bHasMoves) winner = "Beyaz";
    if(wCount === 0 || !wHasMoves) winner = "Siyah";

    if(winner) {
        document.getElementById("over-title").textContent = "Oyun Tamamlandı";
        document.getElementById("over-desc").textContent = `Tebrikler, ${winner} tarafı maçı kazandı!`;
        openModal('gameover-pop');
        return true;
    }
    return false;
}
