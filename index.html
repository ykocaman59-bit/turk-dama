<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türk Daması - Gelişmiş</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #1a1a1a; /* Daha koyu arka plan */
    color: #fff;
    user-select: none;
    margin: 0;
    padding: 10px; /* Kenar boşlukları azaltıldı */
}

h1 {
    margin: 5px 0;
    font-size: 24px;
    text-shadow: 1px 1px 3px #000;
}

#status {
    font-size: 16px;
    margin-bottom: 10px;
    background: rgba(0,0,0,0.5);
    padding: 5px 10px;
    border-radius: 15px;
    border: 1px solid #c19a6b;
}

/* Tahta Boyutları ve Sığdırma Optimizasyonu */
#board-wrapper {
    padding: 8px;
    background: #4a2c11; /* Ahşap çerçeve rengi */
    border-radius: 8px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.7);
    border: 3px solid #2c1d11;
}

#board {
    display: grid;
    /* Kare boyutları küçültüldü: 70px -> 60px */
    grid-template-columns: repeat(8, 60px); 
    grid-template-rows: repeat(8, 60px);
    border: 2px solid #1a0f0a;
}

.cell {
    width: 60px;
    height: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    cursor: pointer;
    position: relative;
    transition: background 0.15s;
}

/* Ahşap Görünümlü Kareler */
.light { background: #e8c39e; }
.dark { background: #b07c53; }

.selected {
    outline: 3px solid #ffeb3b; /* Vurgu çizgisi inceltildi */
    outline-offset: -3px;
    z-index: 2;
}

/* Gidebileceği yer göstergeleri */
.highlight-move {
    position: absolute;
    width: 16px;
    height: 16px;
    background: rgba(46, 204, 113, 0.7);
    border-radius: 50%;
    pointer-events: none;
}

.highlight-capture {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(231, 76, 60, 0.4);
    pointer-events: none;
}

/* Taşların Görsel Tasarımı ve Taç Efektleri */
.piece {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    font-size: 22px; /* Taç ikonu boyutu */
}

/* Beyaz Taşlar */
.piece.white {
    background: #fdfdfd;
    background-image: radial-gradient(circle, #ffffff 0%, #e0e0e0 100%);
    border: 2px solid #b0b0b0;
    color: #444; /* Normal taşın iç detayı için */
}

/* Siyah Taşlar */
.piece.black {
    background: #222;
    background-image: radial-gradient(circle, #444 0%, #111 100%);
    border: 2px solid #000;
    color: #fff;
}

/* Dama (King) Efektleri: Taş rengi korunarak üzerine altın taç */
.piece.king::after {
    content: "👑";
    position: absolute;
    color: #ffcc00; /* Altın rengi taç */
    text-shadow: 0 0 3px #000, 1px 1px 1px #8a6d00;
    font-size: 26px; /* Taç biraz daha büyük */
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%); /* Ortala ve hafif yukarı al */
    z-index: 1;
}

/* Dama ikonu için özel ayar (Unicode detayı varsa kapat) */
.piece.king {
    color: transparent; 
}


/* Menü ve Modal Tasarımı */
#menu-modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.parchment {
    background: #e6c280;
    background-image: radial-gradient(circle, #f3dbab 0%, #d4a359 100%);
    color: #4a2c11;
    padding: 20px;
    border-radius: 12px;
    border: 4px solid #6b3e11;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
    width: 280px;
    text-align: center;
    font-weight: bold;
}

.parchment h2 {
    margin-top: 0;
    margin-bottom: 10px;
    font-size: 20px;
    border-bottom: 2px solid #6b3e11;
    padding-bottom: 5px;
}

.option-group {
    margin: 15px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}

.option-group input {
    width: 18px;
    height: 18px;
    margin-right: 8px;
    cursor: pointer;
}

.start-btn {
    background: #6b3e11;
    color: #fff;
    border: none;
    padding: 8px 25px;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 3px 5px rgba(0,0,0,0.4);
    margin-top: 10px;
}
.start-btn:hover { background: #522f0d; }

#reset-btn {
    margin-top: 10px;
    background: #c19a6b;
    color: #2c1d11;
    border: none;
    padding: 6px 12px;
    font-weight: bold;
    font-size: 14px;
    border-radius: 4px;
    cursor: pointer;
}
</style>
</head>
<body>

<h1>TÜRK DAMASI</h1>
<div id="status">Sıra: Beyaz (Sizde)</div>

<div id="board-wrapper">
    <div id="board"></div>
</div>

<button id="reset-btn" onclick="showMenu()">Yeni Oyun / Ayarlar</button>

<div id="menu-modal">
    <div class="parchment">
        <h2>Yeni Oyun</h2>
        <div class="option-group">
            <input type="checkbox" id="vs-bot" checked>
            <label for="vs-bot">Bota Karşı (Tek Oyuncu)</label>
        </div>
        <button class="start-btn" onclick="startGame()">Başla</button>
    </div>
</div>

<script>
const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const menuModal = document.getElementById("menu-modal");

let turn = "white"; 
let selected = null;
let isBotGame = true;
let comboPiece = null; 

let board = [];

function initBoard() {
    board = [
        ["","","","","","","",""],
        ["b","b","b","b","b","b","b","b"],
        ["b","b","b","b","b","b","b","b"],
        ["","","","","","","",""],
        ["","","","","","","",""],
        ["w","w","w","w","w","w","w","w"],
        ["w","w","w","w","w","w","w","w"],
        ["","","","","","","",""]
    ];
}

function showMenu() {
    menuModal.style.display = "flex";
}

function startGame() {
    isBotGame = document.getElementById("vs-bot").checked;
    menuModal.style.display = "none";
    initBoard();
    turn = "white";
    selected = null;
    comboPiece = null;
    draw();
}

function inBoard(r, c) {
    return r >= 0 && r < 8 && c >= 0 && c < 8;
}

function hasGlobalCapture(color) {
    let char = color === "white" ? "wW" : "bB";
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            if (char.includes(board[r][c])) {
                let moves = getMoves(r, c);
                if (moves.some(m => m.type === "capture")) return true;
            }
        }
    }
    return false;
}

function getMoves(r, c) {
    let piece = board[r][c];
    if (!piece) return [];

    let isKing = (piece === "W" || piece === "B");
    let isWhite = (piece === "w" || piece === "W");
    let moves = [];

    let dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];

    if (!isKing) {
        let forbiddenDir = isWhite ? [1, 0] : [-1, 0]; 

        for (let [dr, dc] of dirs) {
            if (dr === forbiddenDir[0] && dc === forbiddenDir[1]) continue;

            let nr = r + dr, nc = c + dc;
            if (inBoard(nr, nc) && board[nr][nc] === "") {
                moves.push({ r: nr, c: nc, type: "move" });
            }

            let er = r + dr, ec = c + dc; 
            let lr = r + dr * 2, lc = c + dc * 2;
            if (inBoard(lr, lc) && inBoard(er, ec)) {
                let target = board[er][ec];
                if (target !== "" && isWhite !== ("wW".includes(target))) {
                    if (board[lr][lc] === "") {
                        moves.push({ r: lr, c: lc, type: "capture", eat: { r: er, c: ec } });
                    }
                }
            }
        }
    } else {
        for (let [dr, dc] of dirs) {
            let nr = r + dr, nc = c + dc;
            let enemyFound = null;

            while (inBoard(nr, nc)) {
                let current = board[nr][nc];

                if (!enemyFound) {
                    if (current === "") {
                        moves.push({ r: nr, c: nc, type: "move" });
                    } else if (isWhite !== ("wW".includes(current))) {
                        enemyFound = { r: nr, c: ec = nc };
                    } else {
                        break;
                    }
                } else {
                    if (current === "") {
                        moves.push({ r: nr, c: nc, type: "capture", eat: { r: enemyFound.r, c: enemyFound.c } });
                    } else {
                        break;
                    }
                }
                nr += dr; nc += dc;
            }
        }
    }
    return moves;
}

function getLegalMoves(r, c) {
    if (comboPiece && (comboPiece.r !== r || comboPiece.c !== c)) return [];

    let moves = getMoves(r, c);
    let pieceColor = "wW".includes(board[r][c]) ? "white" : "black";

    if (hasGlobalCapture(pieceColor)) {
        moves = moves.filter(m => m.type === "capture");
    }
    return moves;
}

function draw() {
    boardEl.innerHTML = "";

    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            let cell = document.createElement("div");
            cell.className = "cell " + ((r + c) % 2 ? "dark" : "light");

            if (selected && selected.r === r && selected.c === c) {
                cell.classList.add("selected");
            }

            let v = board[r][c];
            if (v) {
                let pieceDiv = document.createElement("div");
                let isWhite = "wW".includes(v);
                let isKing = "WB".includes(v);
                
                pieceDiv.className = `piece ${isWhite ? 'white' : 'black'} ${isKing ? 'king' : ''}`;
                
                // Normal taşlar için basit bir görsel detay (isteğe bağlı, taç değil)
                if (!isKing) {
                    // pieceDiv.textContent = "•"; 
                }

                cell.appendChild(pieceDiv);
            }

            if (selected) {
                let legals = getLegalMoves(selected.r, selected.c);
                let isTarget = legals.find(m => m.r === r && m.c === c);
                if (isTarget) {
                    let indicator = document.createElement("div");
                    indicator.className = isTarget.type === "capture" ? "highlight-capture" : "highlight-move";
                    cell.appendChild(indicator);
                }
            }

            cell.onclick = () => clickCell(r, c);
            boardEl.appendChild(cell);
        }
    }

    let pTurn = turn === "white" ? "Beyaz" : "Siyah";
    let pType = (isBotGame && turn === "black") ? "(Bot)" : "(Sizde)";
    if (!isBotGame) pType = turn === "white" ? "(1. Oyuncu)" : "(2. Oyuncu)";
    
    statusEl.textContent = `Sıra: ${pTurn} ${pType}`;
    if(comboPiece) statusEl.textContent += " [Devam Et!]";
}

function clickCell(r, c) {
    if (isBotGame && turn === "black") return;

    let piece = board[r][c];
    let isWhiteTurn = turn === "white";

    if (piece && (isWhiteTurn === "wW".includes(piece))) {
        if (comboPiece && (comboPiece.r !== r || comboPiece.c !== c)) return;
        selected = { r, c };
        draw();
        return;
    }

    if (!selected) return;

    executeMove(r, c);
}

function executeMove(r, c) {
    let legals = getLegalMoves(selected.r, selected.c);
    let valid = legals.find(m => m.r === r && m.c === c);
    
    if (!valid) return;

    let piece = board[selected.r][selected.c];

    if (valid.type === "capture") {
        board[valid.eat.r][valid.eat.c] = ""; 
    }

    board[r][c] = piece;
    board[selected.r][selected.c] = "";

    // Terfi Kontrolü
    if (piece === "w" && r === 0) board[r][c] = "W";
    if (piece === "b" && r === 7) board[r][c] = "B";

    // Combo Kontrolü
    if (valid.type === "capture") {
        let nextMoves = getMoves(r, c).filter(m => m.type === "capture");
        if (nextMoves.length > 0) {
            comboPiece = { r, c };
            selected = { r, c };
            draw();
            if (isBotGame && turn === "black") setTimeout(makeBotMove, 800);
            return;
        }
    }

    comboPiece = null;
    selected = null;
    turn = (turn === "white") ? "black" : "white";
    draw();

    if (checkGameOver()) return;

    if (isBotGame && turn === "black") {
        setTimeout(makeBotMove, 800);
    }
}

function makeBotMove() {
    let botPieces = [];
    let char = "bB"; 

    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            if (char.includes(board[r][c])) {
                let legals = getLegalMoves(r, c);
                if (legals.length > 0) {
                    botPieces.push({ r, c, moves: legals });
                }
            }
        }
    }

    if (botPieces.length === 0) return; 

    // Bot zekası: Varsa yeme hamlesini, yoksa rastgele hamleyi seçer
    // getLegalMoves zaten yeme zorunluluğunu filtrelediği için botPieces sadece geçerli hamleleri içerir.
    let choicePiece = botPieces[Math.floor(Math.random() * botPieces.length)];
    let choiceMove = choicePiece.moves[Math.floor(Math.random() * choicePiece.moves.length)];

    selected = { r: choicePiece.r, c: choicePiece.c };
    executeMove(choiceMove.r, choiceMove.c);
}

function checkGameOver() {
    let whiteHasMoves = false;
    let blackHasMoves = false;

    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            if ("wW".includes(board[r][c]) && getLegalMoves(r, c).length > 0) whiteHasMoves = true;
            if ("bB".includes(board[r][c]) && getLegalMoves(r, c).length > 0) blackHasMoves = true;
        }
    }

    if (!whiteHasMoves) {
        alert("Oyun Bitti! Siyah Kazandı.");
        showMenu();
        return true;
    } else if (!blackHasMoves) {
        alert("Oyun Bitti! Beyaz Kazandı.");
        showMenu();
        return true;
    }
    return false;
}

initBoard();
draw();
</script>

</body>
</html>
