<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türk Daması</title>

<style>
body{
    font-family:Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:#f0f0f0;
    user-select:none;
}

h1{ margin:10px; }

#board{
    display:grid;
    grid-template-columns:repeat(8,70px);
    grid-template-rows:repeat(8,70px);
    border:4px solid #333;
}

.cell{
    width:70px;
    height:70px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    cursor:pointer;
}

.light{ background:#f5deb3; }
.dark{ background:#c19a6b; }

.selected{ outline:4px solid yellow; }
</style>
</head>

<body>

<h1>Türk Daması</h1>
<div id="status"></div>
<div id="board"></div>

<script>
const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");

let turn = "white";
let selected = null;

// 👑 obje sistem
let board = [
["","","","","","","",""],
["b","b","b","b","b","b","b","b"],
["b","b","b","b","b","b","b","b"],
["","","","","","","",""],
["","","","","","","",""],
["w","w","w","w","w","w","w","w"],
["w","w","w","w","w","w","w","w"],
["","","","","","","",""]
];

function getPiece(v){
    if(!v) return null;
    return {
        color: v,
        king:false
    };
}

function setPiece(p){
    return p ? p.color : "";
}

function inBoard(r,c){
    return r>=0 && r<8 && c>=0 && c<8;
}

// 🧠 zorunlu yeme kontrolü
function hasCapture(color){
    for(let r=0;r<8;r++){
        for(let c=0;c<8;c++){
            if(board[r][c]===color[0]){
                if(getMoves(r,c,true).length>0) return true;
            }
        }
    }
    return false;
}

// 🧠 Türk daması hareket sistemi
function getMoves(r,c,onlyCapture=false){

    let piece = board[r][c];
    if(!piece) return [];

    let moves = [];

    // düz yönler (Türk daması)
    let dirs = [
        [1,0],[-1,0],[0,1],[0,-1]
    ];

    for(let [dr,dc] of dirs){

        // normal hareket
        let nr = r+dr;
        let nc = c+dc;

        if(inBoard(nr,nc) && board[nr][nc]===""){
            if(!onlyCapture){
                moves.push({r:nr,c:nc,type:"move"});
            }
        }

        // yeme (2 adım)
        let er = r+dr;
        let ec = c+dc;
        let lr = r+dr*2;
        let lc = c+dc*2;

        if(inBoard(lr,lc) && inBoard(er,ec)){
            if(board[er][ec] && board[er][ec]!==piece){

                if(board[lr][lc]===""){
                    moves.push({
                        r:lr,
                        c:lc,
                        type:"capture",
                        eat:{r:er,c:ec}
                    });
                }
            }
        }
    }

    return moves;
}

// 🧠 zorunlu yeme varsa sadece capture
function filterMoves(moves,color){
    if(hasCapture(color)){
        return moves.filter(m=>m.type==="capture");
    }
    return moves;
}

function draw(){

    boardEl.innerHTML="";

    for(let r=0;r<8;r++){
        for(let c=0;c<8;c++){

            let cell=document.createElement("div");
            cell.className="cell "+((r+c)%2?"dark":"light");

            if(selected && selected.r===r && selected.c===c){
                cell.classList.add("selected");
            }

            let v = board[r][c];

            if(v){
                cell.textContent = (v==="w") ? "⚪" : "⚫";
            }

            cell.onclick=()=>clickCell(r,c);

            boardEl.appendChild(cell);
        }
    }

    statusEl.textContent =
        "Sıra: " + (turn==="white"?"Beyaz":"Siyah");
}

function clickCell(r,c){

    let piece = board[r][c];

    if(piece && piece[0]===turn[0]){
        selected={r,c};
        draw();
        return;
    }

    if(!selected) return;

    move(r,c);
}

function move(r,c){

    let moves = getMoves(selected.r,selected.c,false);
    moves = filterMoves(moves,turn);

    let valid = moves.find(m=>m.r===r && m.c===c);
    if(!valid) return;

    let piece = board[selected.r][selected.c];

    if(valid.type==="capture"){
        board[valid.eat.r][valid.eat.c]="";
    }

    board[r][c]=piece;
    board[selected.r][selected.c]="";

    // 👑 promotion
    if(piece==="w" && r===0) board[r][c]="W";
    if(piece==="b" && r===7) board[r][c]="B";

    turn = (turn==="white")?"black":"white";
    selected=null;

    draw();
}

draw();
</script>

</body>
</html>
