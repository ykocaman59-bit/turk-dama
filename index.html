<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
<title>Türk Daması - Pro</title>

<style>
:root {
    --board-bg: #b07c53;
    --board-light: #e8c39e;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background: #150f0a;
    color: #fff;
    user-select: none;
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* Üst Panel ve Yenilen Taş Havuzu */
#top-panel {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 5px;
}

#status {
    font-size: 14px;
    background: rgba(0,0,0,0.6);
    padding: 4px 12px;
    border-radius: 10px;
    border: 1px solid #c19a6b;
    margin-bottom: 5px;
}

.captured-pool {
    display: flex;
    justify-content: flex-start;
    width: 90%;
    height: 24px;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 5px;
    margin: 2px 0;
    padding: 2px 5px;
    overflow: hidden;
    direction: rtl; /* Sağdan sola doğru eksilme/dizilme simülasyonu */
}

.pool-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    margin: 2px;
    box-shadow: inset 0 0 4px #000;
    flex-shrink: 0;
}
.pool-dot.w { background: #fff; border: 1px solid #ccc; }
.pool-dot.b { background: #222; border: 1px solid #000; }

/* Tahta Alanı (Ekrana Tam Sığdırma Optimizasyonu) */
#board-container {
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-height: 60vh;
}

#board-wrapper {
    padding: 10px;
    background: #4a2c11; 
    border-radius: 8px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.8);
    border: 4px solid #2c1d11;
}

#board {
    display: grid;
    grid-template-columns: repeat(8, min(11vw, 6vh));
    grid-template-rows: repeat(8, min(11vw, 6vh));
    border: 2px solid #1a0f0a;
}

.cell {
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    position: relative;
}

.light { background: var(--board-light); }
.dark { background: var(--board-bg); }

.selected {
    outline: 3px solid #ffeb3b;
    outline-offset: -3px;
    z-index: 2;
}

.last-move-highlight {
    box-shadow: inset 0 0 10px 3px rgba(241, 196, 15, 0.6);
}

.highlight-move {
    position: absolute;
    width: 30%;
    height: 30%;
    background: rgba(46, 204, 113, 0.8);
    border-radius: 50%;
    pointer-events: none;
}

.highlight-capture {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(231, 76, 60, 0.4);
    pointer-events: none;
}

/* Taş Tasarımları */
.piece {
    width: 80%;
    height: 80%;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    box-shadow: 0 4px 6px rgba(0,0,0,0.5);
}

.piece.white {
    background: radial-gradient(circle, #ffffff 0%, #dcdcdc 100%);
    border: 2px solid #b5b5b5;
}

.piece.black {
    background: radial-gradient(circle, #444 0%, #151515 100%);
    border: 2px solid #000;
}

.piece.king::after {
    content: "👑";
    position: absolute;
    font-size: min(5vw, 3vh);
    top: 50%; left: 50%;
    transform: translate(-50%, -55%);
    text-shadow: 0 1px 3px #000;
}

/* Alt Menü Barı */
#bottom-bar {
    width: 100%;
    background: #3d2512;
    border-top: 3px solid #241407;
    display: flex;
    justify-content: space-around;
    padding: 8px 0;
}

.menu-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: none;
    border: none;
    color: #d4a359;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
}
.menu-btn-icon {
    font-size: 20px;
    margin-bottom: 2px;
}

/* Pencereler / Modallar (Görseldeki Parşömen Teması) */
.modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.parchment {
    background: #e6c280;
    background-image: radial-gradient(circle, #f3dbab 0%, #d4a359 100%);
    color: #311c07;
    padding: 20px;
    border-radius: 12px;
    border: 4px solid #5a330b;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    width: 300px;
    text-align: center;
    font-weight: bold;
}

.parchment h2 {
    margin: 0 0 15px 0;
    font-size: 22px;
    border-bottom: 2px solid #5a330b;
    padding-bottom: 5px;
}

.option-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin: 12px 0;
    font-size: 15px;
}
.option-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-right: 10px;
    accent-color: #5a330b;
}

/* Yeni Oyun Taş Seçimi Alanı */
.stone-select-container {
    display: flex;
    justify-content: space-around;
    margin: 20px 0;
}
.stone-box {
    width: 80px;
    height: 80px;
    border: 3px solid #5a330b;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    background: rgba(255,255,255,0.2);
    position: relative;
}
.stone-box.active {
    outline: 4px solid #2ecc71;
}
.stone-box .ui-piece {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
}
.stone-box .ui-piece.w { background: #fff; border: 2px solid #bbb; color: #000;}
.stone-box .ui-piece.b { background: #222; border: 2px solid #000; color: #fff;}

/* Slider (Zorluk Seviyesi) */
.slider-container {
    margin: 15px 0;
    text-align: left;
}
.slider-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-top: 2px;
}
input[type="range"] {
    width: 100%;
    accent-color: #5a330b;
}

/* Renk Seçimi Düğmeleri */
.color-picker {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
}
.color-opt {
    width: 30px;
    height: 30px;
    border: 2px solid #5a330b;
    border-radius: 4px;
    cursor: pointer;
}

.action-btn {
    background: #5a330b;
    color: #fff;
    border: none;
    padding: 10px 30px;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 4px 5px rgba(0,0,0,0.3);
    margin-top: 10px;
    width: 100%;
}
</style>
</head>
<body>

<div id="top-panel">
    <div id="status">Sıra: Beyaz (Sizde)</div>
    <div class="captured-pool" id="pool-black"></div>
    <div class="captured-pool" id="pool-white"></div>
</div>

<div id="board-container">
    <div id="board-wrapper">
        <div id="board"></div>
    </div>
</div>

<div id="bottom-bar">
    <button class="menu-btn" onclick="openNewGameModal()">
        <span class="menu-btn-icon">▶</span><span>Yeni</span>
    </button>
    <button class="menu-btn" onclick="openSettingsModal()">
        <span class="menu-btn-icon">⚙</span><span>Ayarlar</span>
    </button>
</div>

<div id="newgame-modal" class="modal" style="display: flex;">
    <div class="parchment">
        <h2>Yeni oyun</h2>
        <div class="option-row">
            <input type="checkbox" id="vs-bot" checked onchange="toggleBotUi()">
            <label for="vs-bot">Tek oyuncu</label>
        </div>
        <p style="margin: 10px 0 5px 0;">Taş seç</p>
        <div class="stone-select-container">
            <div class="stone-box active" id="sel-white" onclick="selectPlayerColor('white')">
                <div class="ui-piece w">👑</div>
            </div>
            <div class="stone-box" id="sel-black" onclick="selectPlayerColor('black')">
                <div class="ui-piece b">👑</div>
            </div>
        </div>
        <button class="action-btn" onclick="startNewGame()">İptal / Başla</button>
    </div>
</div>

<div id="settings-modal" class="modal" style="display: none;">
    <div class="parchment">
        <h2>Ayarlar</h2>
        <div class="slider-container">
            <label>Zorluk</label>
            <input type="range" id="difficulty" min="1" max="3" value="2">
            <div class="slider-labels">
                <span>kolay</span><span>seviye 3</span><span>zor</span>
            </div>
        </div>
        <div class="option-row"><input type="checkbox" id="sett-lastmove" checked><label>Son hamleyi göster</label></div>
        <div class="option-row"><input type="checkbox" id="sett-hints" checked><label>Kareleri işaretle</label></div>
        <div class="option-row"><input type="checkbox" id="sett-border" checked onchange="toggleBorderUi()"><label>Tahta çerçevesini göster</label></div>
        <div class="option-row"><input type="checkbox" id="sett-sound" checked><label>Sesleri çal</label></div>
        
        <p style="margin: 10px 0 5px 0; text-align:left; font-size:14px;">Tahta Rengi Değiştir</p>
        <div class="color-picker">
            <div class="color-opt" style="background:#b07c53;" onclick="changeBoardColor('#b07c53','#e8c39e')"></div>
            <div class="color-opt" style="background:#2b5797;" onclick="changeBoardColor('#2b5797','#719bd6')"></div>
            <div class="color-opt" style="background:#1e1e1e;" onclick="changeBoardColor('#333333','#aaaaaa')"></div>
            <div class="color-opt" style="background:#4b6b2c;" onclick="changeBoardColor('#4b6b2c','#8da66f')"></div>
        </div>
        <button class="action-btn" onclick="closeSettingsModal()">Tamam</button>
    </div>
</div>

<div id="gameover-modal" class="modal" style="display: none;">
    <div class="parchment">
        <h2 id="win-title">Beyaz Kazandı!</h2>
        <p>Tüm rakip taşlar temizlendi.</p>
        <button class="action-btn" onclick="closeGameOverModal()">Tamam</button>
    </div>
</div>

<script>
// --- SES SİSTEMİ (Web Audio API ile Dama Uygulama Sesleri) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let winBufferSource = null;

function playSound(type) {
    if (!document.getElementById("sett-sound").checked) return;
    
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === "eat") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === "king") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.setValueAtTime(554, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === "win") {
        // Melodik bir kazanma jingle loop simülasyonu
        try {
            let t = audioCtx.currentTime;
            let notes = [523, 659, 784, 1046];
            notes.forEach((f, i) => {
                let o = audioCtx.createOscillator();
                let g = audioCtx.createGain();
                o.type = "sine"; o.frequency.value = f;
                o.connect(g); g.connect(audioCtx.destination);
                g.gain.setValueAtTime(0.15, t + i*0.15);
                g.gain.linearRampToValueAtTime(0, t + i*0.15 + 0.3);
                o.start(t + i*0.15); o.stop(t + i*0.15 + 0.3);
            });
        } catch(e){}
    }
}

// --- OYUN DEĞİŞKENLERİ ---
const boardEl = document.getElementById("board");
let turn = "white";
let selected = null;
let isBotGame = true;
let playerColor = "white";
let comboPiece = null;
let lastMove = null;

let board = [];
let initialWhiteCount = 16;
let initialBlackCount = 16;

function initData() {
    board = [
        ["","","","","","","",""],
        ["b","b","b","b","b","b","b","b"],
        ["b","b","b","b","b","b","b","b"],
        ["","","","","","","",""],
        ["","","","","","","",""],
        ["w","w","w","w","w","w","w","w"],
        ["w","w","w","w","w","w","w","w"],
        ["","","","","","","",""]
    ];
    comboPiece = null;
    lastMove = null;
    turn = "white";
    selected = null;
}

// Modalları Yönetme Fonksiyonları
function openNewGameModal() { document.getElementById("newgame-modal").style.display = "flex"; }
function openSettingsModal() { document.getElementById("settings-modal").style.display = "flex"; }
function closeSettingsModal() { document.getElementById("settings-modal").style.display = "none"; }
function toggleBotUi() {
    isBotGame = document.getElementById("vs-bot").checked;
}
function selectPlayerColor(col) {
    playerColor = col;
    document.getElementById("sel-white").classList.remove("active");
    document.getElementById("sel-black").classList.remove("active");
    if(col === "white") document.getElementById("sel-white").classList.add("active");
    else document.getElementById("sel-black").classList.add("active");
}

function toggleBorderUi() {
    let hasBorder = document.getElementById("sett-border").checked;
    document.getElementById("board-wrapper").style.border = hasBorder ? "4px solid #2c1d11" : "none";
}

function changeBoardColor(bg, light) {
    document.documentElement.style.setProperty('--board-bg', bg);
    document.documentElement.style.setProperty('--board-light', light);
}

function startNewGame() {
    isBotGame = document.getElementById("vs-bot").checked;
    document.getElementById("newgame-modal").style.display = "none";
    initData();
    updateCapturedPools();
    draw();
    triggerBotCycle();
}

function closeGameOverModal() {
    document.getElementById("gameover-modal").style.display = "none";
    openNewGameModal();
}

// --- HAVUZU GÜNCELLEME (Yenilen taşları sağdan sola listeleme) ---
function updateCapturedPools() {
    let currentWhite = 0, currentBlack = 0;
    for(let r=0; r<8; r++) {
        for(let c=0; c<8; c++) {
            if("wW".includes(board[r][c])) currentWhite++;
            if("bB".includes(board[r][c])) currentBlack++;
        }
    }
    
    let deadWhite = initialWhiteCount - currentWhite;
    let deadBlack = initialBlackCount - currentBlack;

    let poolWhiteEl = document.getElementById("pool-white");
    let poolBlackEl = document.getElementById("pool-black");

    poolWhiteEl.innerHTML = "";
    poolBlackEl.innerHTML = "";

    // Yenilen beyaz taşları beyaz havuzuna diz
    for(let i=0; i<deadWhite; i++) {
        let d = document.createElement("div"); d.className = "pool-dot w";
        poolWhiteEl.appendChild(d);
    }
    // Yenilen siyah taşları siyah havuzuna diz
    for(let i=0; i<deadBlack; i++) {
        let d = document.createElement("div"); d.className = "pool-dot b";
        poolBlackEl.appendChild(d);
    }
}

// --- TÜRK DAMASI KURALLARI VE MANTIKSAL KODLARI ---
function inBoard(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }

function hasGlobalCapture(color) {
    let char = color === "white" ? "wW" : "bB";
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            if (char.includes(board[r][c])) {
                if (getMoves(r, c).some(m => m.type === "capture")) return true;
            }
        }
    }
    return false;
}

function getMoves(r, c) {
    let piece = board[r][c];
    if (!piece) return [];

    let isKing = (piece === "W" || piece === "B");
    let isWhite = (piece === "w" || piece === "W");
    let moves = [];
    let dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];

    if (!isKing) {
        let forbiddenDir = isWhite ? [1, 0] : [-1, 0]; 
        for (let [dr, dc] of dirs) {
            if (dr === forbiddenDir[0] && dc === forbiddenDir[1]) continue;

            let nr = r + dr, nc = c + dc;
            if (inBoard(nr, nc) && board[nr][nc] === "") {
                moves.push({ r: nr, c: nc, type: "move" });
            }

            let er = r + dr, ec = c + dc; 
            let lr = r + dr * 2, lc = c + dc * 2;
            if (inBoard(lr, lc) && inBoard(er, ec)) {
                let target = board[er][ec];
                if (target !== "" && isWhite !== ("wW".includes(target))) {
                    if (board[lr][lc] === "") {
                        moves.push({ r: lr, c: lc, type: "capture", eat: { r: er, c: ec } });
                    }
                }
            }
        }
    } else {
        for (let [dr, dc] of dirs) {
            let nr = r + dr, nc = c + dc;
            let enemyFound = null;

            while (inBoard(nr, nc)) {
                let current = board[nr][nc];
                if (!enemyFound) {
                    if (current === "") {
                        moves.push({ r: nr, c: nc, type: "move" });
                    } else if (isWhite !== ("wW".includes(current))) {
                        enemyFound = { r: nr, c: nc };
                    } else {
                        break;
                    }
                } else {
                    if (current === "") {
                        moves.push({ r: nr, c: nc, type: "capture", eat: { r: enemyFound.r, c: enemyFound.c } });
                    } else {
                        break;
                    }
                }
                nr += dr; nc += dc;
            }
        }
    }
    return moves;
}

function getLegalMoves(r, c) {
    if (comboPiece && (comboPiece.r !== r || comboPiece.c !== c)) return [];
    let moves = getMoves(r, c);
    let pieceColor = "wW".includes(board[r][c]) ? "white" : "black";

    if (hasGlobalCapture(pieceColor)) {
        moves = moves.filter(m => m.type === "capture");
    }
    return moves;
}

// --- TAHTAYI EKRANA ÇİZME ---
function draw() {
    boardEl.innerHTML = "";
    let showHints = document.getElementById("sett-hints").checked;
    let showLastMove = document.getElementById("sett-lastmove").checked;

    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            let cell = document.createElement("div");
            cell.className = "cell " + ((r + c) % 2 ? "dark" : "light");

            if (selected && selected.r === r && selected.c === c) {
                cell.classList.add("selected");
            }

            if (showLastMove && lastMove && ((lastMove.from.r === r && lastMove.from.c === c) || (lastMove.to.r === r && lastMove.to.c === c))) {
                cell.classList.add("last-move-highlight");
            }

            let v = board[r][c];
            if (v) {
                let pieceDiv = document.createElement("div");
                let isWhite = "wW".includes(v);
                let isKing = "WB".includes(v);
                pieceDiv.className = `piece ${isWhite ? 'white' : 'black'} ${isKing ? 'king' : ''}`;
                cell.appendChild(pieceDiv);
            }

            if (selected && showHints) {
                let legals = getLegalMoves(selected.r, selected.c);
                let isTarget = legals.find(m => m.r === r && m.c === c);
                if (isTarget) {
                    let indicator = document.createElement("div");
                    indicator.className = isTarget.type === "capture" ? "highlight-capture" : "highlight-move";
                    cell.appendChild(indicator);
                }
            }

            cell.onclick = () => clickCell(r, c);
            boardEl.appendChild(cell);
        }
    }

    let pTurn = turn === "white" ? "Beyaz" : "Siyah";
    let pType = (isBotGame && turn !== playerColor) ? "(Bot)" : "(Sizde)";
    statusEl.textContent = `Sıra: ${pTurn} ${pType}`;
    if (comboPiece) statusEl.textContent += " [Yemeye Devam Et!]";
}

function clickCell(r, c) {
    if (isBotGame && turn !== playerColor) return;

    let piece = board[r][c];
    let isWhiteTurn = turn === "white";

    if (piece && (isWhiteTurn === "wW".includes(piece))) {
        if (comboPiece && (comboPiece.r !== r || comboPiece.c !== c)) return;
        selected = { r, c };
        draw();
        return;
    }
    if (!selected) return;
    executeMove(r, c);
}

function executeMove(r, c) {
    let legals = getLegalMoves(selected.r, selected.c);
    let valid = legals.find(m => m.r === r && m.c === c);
    if (!valid) return;

    let piece = board[selected.r][selected.c];
    let isEaten = false;

    if (valid.type === "capture") {
        board[valid.eat.r][valid.eat.c] = ""; 
        isEaten = true;
        playSound("eat");
    }

    board[r][c] = piece;
    board[selected.r][selected.c] = "";
    
    lastMove = { from: { r: selected.r, c: selected.c }, to: { r, c } };

    // Dama Terfi Kontrolü ve Ses Tetikleyicisi
    let becameKing = false;
    if (piece === "w" && r === 0) { board[r][c] = "W"; becameKing = true; }
    if (piece === "b" && r === 7) { board[r][c] = "B"; becameKing = true; }
    if (becameKing) { playSound("king"); }

    updateCapturedPools();

    // Çoklu taş yeme döngüsü (Combo Kontrolü)
    if (valid.type === "capture") {
        let nextMoves = getMoves(r, c).filter(m => m.type === "capture");
        if (nextMoves.length > 0) {
            comboPiece = { r, c };
            selected = { r, c };
            draw();
            if (isBotGame && turn !== playerColor) setTimeout(makeBotMove, 700);
            return;
        }
    }

    comboPiece = null;
    selected = null;
    turn = (turn === "white") ? "black" : "white";
    draw();

    if (checkGameOver()) return;
    triggerBotCycle();
}

function triggerBotCycle() {
    if (isBotGame && turn !== playerColor) {
        setTimeout(makeBotMove, 700);
    }
}

// --- YAPAY ZEKA (ZORLUK SEVİYESİ ENTEGRELİ BOT) ---
function makeBotMove() {
    let botPieces = [];
    let char = turn === "white" ? "wW" : "bB"; 

    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            if (char.includes(board[r][c])) {
                let legals = getLegalMoves(r, c);
                if (legals.length > 0) {
                    botPieces.push({ r, c, moves: legals });
                }
            }
        }
    }

    if (botPieces.length === 0) return;

    let difficulty = parseInt(document.getElementById("difficulty").value); // 1: Kolay, 2: Orta, 3: Zor
    let choicePiece = null;
    let choiceMove = null;

    // Eğer yeme hamlesi varsa zorunlu olarak elenir (Kurallar gereği her seviyede yeme önceliklidir)
    let hasCaptureMove = botPieces.some(p => p.moves.some(m => m.type === "capture"));

    if (hasCaptureMove || difficulty === 3) {
        // En iyi hamleyi bulmaya çalış (Dama yapan veya korunaklı alan seçimi)
        let flatMoves = [];
        botPieces.forEach(p => {
            p.moves.forEach(m => {
                flatMoves.push({ from: { r: p.r, c: p.c }, move: m, weight: (m.type === "capture" ? 10 : 1) });
            });
        });
        // Ağırlığa göre sırala (Zor mod her zaman en avantajlıyı seçmeye odaklanır)
        flatMoves.sort((a,b) => b.weight - a.weight);
        let best = flatMoves[0];
        selected = best.from;
        executeMove(best.move.r, best.move.c);
    } else {
        // Kolay ve Orta modda rastgele yürüyüş payı bırakılır
        choicePiece = botPieces[Math.floor(Math.random() * botPieces.length)];
        choiceMove = choicePiece.moves[Math.floor(Math.random() * choicePiece.moves.length)];
        selected = { r: choicePiece.r, c: choicePiece.c };
        executeMove(choiceMove.r, choiceMove.c);
    }
}

// --- OYUN BİTİŞ KONTROLÜ VE KAZANMA JINGLE ---
function checkGameOver() {
    let whitePieces = 0, blackPieces = 0;
    let whiteHasMoves = false, blackHasMoves = false;

    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            let p = board[r][c];
            if ("wW".includes(p)) {
                whitePieces++;
                if (getLegalMoves(r, c).length > 0) whiteHasMoves = true;
            }
            if ("bB".includes(p)) {
                blackPieces++;
                if (getLegalMoves(r, c).length > 0) blackHasMoves = true;
            }
        }
    }

    let winner = null;
    if (blackPieces === 0 || !blackHasMoves) winner = "Beyaz";
    if (whitePieces === 0 || !whiteHasMoves) winner = "Siyah";

    if (winner) {
        document.getElementById("win-title").textContent = `${winner} Kazandı!`;
        document.getElementById("gameover-modal").style.display = "flex";
        playSound("win");
        return true;
    }
    return false;
}
