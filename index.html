<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Dama Oyunu</title>

<style>
body {
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#222;
    margin:0;
}

#board {
    display:grid;
    grid-template-columns: repeat(8, 60px);
    grid-template-rows: repeat(8, 60px);
    border:3px solid #000;
    user-select:none;
}

.cell {
    width:60px;
    height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.black { background:#769656; }
.white { background:#eeeed2; }

.piece {
    width:45px;
    height:45px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:bold;
    user-select:none;
}

.red { background:red; color:white; }
.blue { background:blue; color:white; }

.selected {
    outline:3px solid yellow;
}
</style>
</head>

<body>

<div id="board"></div>

<script>
const board = document.getElementById("board");

let selected = null;
let turn = "red";

let state = createBoard();

function createBoard() {
    let b = Array(8).fill(null).map(()=>Array(8).fill(null));

    for(let y=0;y<3;y++){
        for(let x=0;x<8;x++){
            if((x+y)%2===1) b[y][x] = {color:"blue", king:false};
        }
    }

    for(let y=5;y<8;y++){
        for(let x=0;x<8;x++){
            if((x+y)%2===1) b[y][x] = {color:"red", king:false};
        }
    }
    return b;
}

function draw(){
    board.innerHTML="";

    for(let y=0;y<8;y++){
        for(let x=0;x<8;x++){

            let cell = document.createElement("div");
            cell.className = "cell " + ((x+y)%2===0 ? "white":"black");

            let p = state[y][x];

            if(p){
                let piece = document.createElement("div");
                piece.className = "piece " + p.color;

                piece.innerHTML = p.king ? "👑" : "";

                piece.onclick = ()=>select(x,y);

                if(selected && selected.x===x && selected.y===y){
                    piece.classList.add("selected");
                }

                cell.appendChild(piece);
            }

            cell.onclick = ()=>move(x,y);

            board.appendChild(cell);
        }
    }
}

function select(x,y){
    let p = state[y][x];
    if(p && p.color===turn){
        selected = {x,y};
        draw();
    }
}

function move(x,y){
    if(!selected) return;

    let sx = selected.x;
    let sy = selected.y;

    let piece = state[sy][sx];
    let dx = x - sx;
    let dy = y - sy;

    let moves = getMoves(sx,sy,piece);

    let valid = moves.find(m=>m.x===x && m.y===y);

    if(!valid) return;

    if(valid.type==="capture"){
        state[valid.captured.y][valid.captured.x] = null;
    }

    state[y][x] = piece;
    state[sy][sx] = null;

    if(piece.color==="red" && y===0) piece.king=true;
    if(piece.color==="blue" && y===7) piece.king=true;

    turn = turn==="red"?"blue":"red";
    selected=null;

    draw();
}

function getMoves(x,y,piece){
    let moves = [];

    let dirs = piece.king ?
        [[1,1],[1,-1],[-1,1],[-1,-1]] :
        piece.color==="red" ?
        [[-1,-1],[-1,1]] :
        [[1,1],[1,-1]];

    for(let [dx,dy] of dirs){

        let nx = x+dx;
        let ny = y+dy;

        if(empty(nx,ny)){
            moves.push({x:nx,y:ny,type:"move"});
        }

        let cx = x+dx;
        let cy = y+dy;
        let lx = x+dx*2;
        let ly = y+dy*2;

        if(enemy(cx,cy,piece) && empty(lx,ly)){
            moves.push({
                x:lx,
                y:ly,
                type:"capture",
                captured:{x:cx,y:cy}
            });
        }
    }

    let captures = moves.filter(m=>m.type==="capture");
    return captures.length ? captures : moves;
}

function empty(x,y){
    return x>=0 && x<8 && y>=0 && y<8 && !state[y][x];
}

function enemy(x,y,piece){
    return x>=0 && x<8 && y>=0 && y<8 &&
           state[y][x] &&
           state[y][x].color !== piece.color;
}

draw();
</script>

</body>
</html>
